[package]
name = "taltech-food-cli"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/silverxd/taltech-food-cli-rs/"

[dependencies]
colored = "3.1.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bin]]
name = "food"
path = "src/main.rs"
